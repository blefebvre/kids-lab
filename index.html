<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kids Lab</title>
  <style>
    :root {
      --bg: #fdf6e3;
      --card: #ffffff;
      --text: #2b2b3a;
      --muted: #6b6b80;
      --accent: #ff6b6b;
      --border: #eadfc8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1b2a;
        --card: #26263a;
        --text: #f2f2f7;
        --muted: #a8a8c0;
        --accent: #ff8a8a;
        --border: #3a3a55;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }
    main { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 2.5rem; margin: 0 0 4px; }
    .tagline { color: var(--muted); margin: 0 0 32px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    a.card {
      display: block;
      padding: 20px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s, border-color 0.15s;
    }
    a.card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .card h2 { margin: 0 0 4px; font-size: 1.25rem; }
    .author { color: var(--accent); font-weight: 600; font-size: 0.9rem; }
    .card p { color: var(--muted); margin: 8px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>🚀 Kids Lab</h1>
    <p class="tagline">Games and apps we built. Click one to play!</p>
    <div class="grid" id="projects"></div>
  </main>
  <script>
    // Load the list of projects from projects.json and make a card for each one.
    fetch('projects.json')
      .then(response => response.json())
      .then(projects => {
        const grid = document.getElementById('projects');
        for (const project of projects) {
          const card = document.createElement('a');
          card.className = 'card';
          card.href = project.path;

          const title = document.createElement('h2');
          title.textContent = project.title;
          const author = document.createElement('div');
          author.className = 'author';
          author.textContent = 'by ' + project.author;
          const description = document.createElement('p');
          description.textContent = project.description;

          card.append(title, author, description);
          grid.append(card);
        }
      });
  </script>
</body>
</html>
