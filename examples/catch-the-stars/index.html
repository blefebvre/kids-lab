<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catch the Stars</title>
  <style>
    body {
      margin: 0;
      background: #10102a;
      color: white;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    canvas {
      background: #1c1c4a;
      border-radius: 12px;
      max-width: 100%;
      touch-action: none;
    }
    a { color: #ffd84a; }
  </style>
</head>
<body>
  <canvas id="game" width="480" height="640"></canvas>
  <p>Move with ← → arrow keys, the mouse, or your finger. <a href="../../">Back to the lab</a></p>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // ===== Things you can change! Try different numbers. =====
    const BASKET_WIDTH = 90;
    const BASKET_SPEED = 7;
    const STAR_SPEED = 2;        // how fast stars fall at the start
    const SPEED_UP = 0.1;        // how much faster they get with each catch
    const LIVES = 3;
    const STAR_COLOR = '#ffd84a';
    const BASKET_COLOR = '#ff6b6b';

    // ===== The game's memory (its "state") =====
    let basketX = canvas.width / 2;
    let stars = [];
    let score = 0;
    let lives = LIVES;
    let gameOver = false;
    const keys = {};

    function addStar() {
      stars.push({
        x: 20 + Math.random() * (canvas.width - 40),
        y: -20,
        speed: STAR_SPEED + score * SPEED_UP,
      });
    }

    function restart() {
      stars = [];
      score = 0;
      lives = LIVES;
      gameOver = false;
      addStar();
    }

    // ===== Controls =====
    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (gameOver && (e.key === ' ' || e.key === 'Enter')) restart();
    });
    document.addEventListener('keyup', e => { keys[e.key] = false; });

    function moveToPointer(e) {
      const rect = canvas.getBoundingClientRect();
      basketX = (e.clientX - rect.left) * (canvas.width / rect.width);
    }
    canvas.addEventListener('pointermove', moveToPointer);
    canvas.addEventListener('pointerdown', e => {
      if (gameOver) restart();
      moveToPointer(e);
    });

    // ===== Update: move everything a tiny bit =====
    function update() {
      if (gameOver) return;

      if (keys['ArrowLeft']) basketX -= BASKET_SPEED;
      if (keys['ArrowRight']) basketX += BASKET_SPEED;
      basketX = Math.max(BASKET_WIDTH / 2, Math.min(canvas.width - BASKET_WIDTH / 2, basketX));

      const basketTop = canvas.height - 40;
      for (const star of stars) {
        star.y += star.speed;

        const caught = star.y > basketTop && star.y < basketTop + 20 &&
                       Math.abs(star.x - basketX) < BASKET_WIDTH / 2;
        if (caught) {
          star.done = true;
          score += 1;
          addStar();
        } else if (star.y > canvas.height) {
          star.done = true;
          lives -= 1;
          if (lives <= 0) gameOver = true;
          else addStar();
        }
      }
      stars = stars.filter(star => !star.done);
    }

    // ===== Draw: paint the picture for this moment =====
    function drawStar(x, y, size) {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const angle = (Math.PI / 5) * i - Math.PI / 2;
        const radius = i % 2 === 0 ? size : size / 2.2;
        ctx.lineTo(x + Math.cos(angle) * radius, y + Math.sin(angle) * radius);
      }
      ctx.closePath();
      ctx.fillStyle = STAR_COLOR;
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const star of stars) drawStar(star.x, star.y, 16);

      ctx.fillStyle = BASKET_COLOR;
      ctx.fillRect(basketX - BASKET_WIDTH / 2, canvas.height - 40, BASKET_WIDTH, 20);

      ctx.fillStyle = 'white';
      ctx.font = 'bold 24px system-ui';
      ctx.textAlign = 'left';
      ctx.fillText('Score: ' + score, 16, 36);
      ctx.textAlign = 'right';
      ctx.fillText('❤️'.repeat(lives), canvas.width - 16, 36);

      if (gameOver) {
        ctx.textAlign = 'center';
        ctx.font = 'bold 48px system-ui';
        ctx.fillText('Game Over!', canvas.width / 2, canvas.height / 2);
        ctx.font = '22px system-ui';
        ctx.fillText('Press Space or tap to play again', canvas.width / 2, canvas.height / 2 + 44);
      }
    }

    // ===== The game loop: update, draw, repeat (about 60 times a second) =====
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    restart();
    loop();
  </script>
</body>
</html>
